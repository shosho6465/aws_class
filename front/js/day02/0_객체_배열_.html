<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		/*
		JSON.stringify(객체)
		-객체를 json 형태의 문자열로 변환
		-json 배열인 경우
		[{
		"변수명" : 1
		"변수명" : "문자열"
		}]
		JSON.parse(문자열)
		-JSON 형태의 문자열을 객체로 변환
		*/
		let obj = {
			name = "홍길동"
		};
		document.write('JSON.stringify(obj) : ${JSON.stringify(obj)},타입 : ${typeof JSON.stringify(obj)} <br>');
		let str = '{"age" : 20, "name" : "홍길동"}';
		document.write('JSON.parde(str) : ${JSON.parse(str)} <br>');
		console.log(JSON.parde(str));

		//객체에서 객체 속성 값 가져와서 변수에 저장하기
		let student = {
			num : 1,
			name : "홍길동"
			addr : "서울시"
		}
		let num = student.num;
		let name = student.name;
		let addr = student.addr;
		let {num, name, addr} = student;

		document.write('번호 : ${num}, 이름 : ${name}, 주소 : ${addr} <br>');
		
	</script>
</body>
</html>
