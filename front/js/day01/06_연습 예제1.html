<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연습 예제</title>
</head>
<body>
	<!-- 
	정수를 2번 입력 받고, document.write로 화면에 입력 받은 두 정수를 출력하세요. -->
	<script>
console.log(prompt('몇 시에 가장 행복한가요?'))

let num1, num2;
num1 = prompt("정수 1을 입력", 0)
num2 = prompt("정수 2을 입력")
document.write('정수1 : ${num1}<br>');
document.write('정수2 : ' + num2 +'<br>');

	</script>
  
</body>
</html>
