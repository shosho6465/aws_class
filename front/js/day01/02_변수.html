<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<pre>
	<script>
		// : 한줄 주석
		/* 여러 줄 주석 */
		/*
		변수 선언 방법
		방법1.
		var 변수명 = 값;
		var 변수명;

		방법2
		let 변수명 = 값;
		let 변수명;

		변수
		-값을 저장하는 공간
		-예
		  -1000
		  -볼펜값 : 1000

		var와 let의 차이
		var는 호이스팅이 일어나지만, let은 일어나지 않음
		-var는 동일한 변수를 중복 선언해도 동작, let은 예외 발생
		-let 사용을 추천
    */
	  /*
		호이스팅
		-페이지 로딩 시 변수나 함수가 제일 위로 올려지는 동작
		-var로 선언된 변수, 함수는 호이스팅이 적용

		let age = 20;
		// let age = 20;  예외발생 
		var name = "홍길동";
		var name = "홍길동";

		count = 10; // 선언 전 초기화
		let count // 변수 선언

		count2 = 20; // 선언 전 초기화
		var count2 = 20; //

		/*
		상수 선언: 값을 한 번 지정하면 바꿀 수 없는 것
		-상수는 보통 대문자로
		-여러 단어로 이루어진 경우 _를 이용
		선언 방법: 
		-const 상수명 = 값
		*/
		const PI = 3.14;
		//PI = 3.14//상수 재할당이 안 됨
		/* 
		변수명 작성 관례(카멜 표기법): 지키지 않아도 문제가 되지 않지만 보통 지키는 것
		-변수명은 의미 있게 작성
		 -잘못된 예: a(사과의 개수)
		 -잘된 예: appleCount
		-카멜 표기법
		 -두 단어 이상으로 된 변수명의 두번째 단어부터 첫글자를 대문자로

		변수명(상수) 작성 규칙: 꼭 지켜야 하는 것
		 -변수명은 숫자로 시작 x
		 -변수명에 특수문자는 _와 $만 가능(공백 x)
		 -예약어(키워드) 사용 불가
		  -예약어 : 기능이 있는 단어. const, let, class 등
		-변수명은 대소문자를 구별
		 -num과 NUM은 다른 변수

		-상수는 변수와 달리 대문자를 쓴다.
		*/
	

	</script>
	</pre>
</body>
</html>
