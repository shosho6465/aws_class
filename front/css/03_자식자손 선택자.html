<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>자식자손 선택자 예시</title>
	<!-- 
	자식 선택자
	-부모 선택자 > 자식 선택자
	-요소 안에 있는 자식을 선택
	
	-자손 선택자
	-조상선택자 자손선택자(공백으로 구분)
	-요소 안에 있는 자손을 선택
	-자식 요소도 포함
	-->
	<style>
		.box{color: red;}
		.box > .link{color: green;}
		/* 우선순위가 같으면 밑에 있는 속성이 적용된다. */
		.container .link{color: blue;}
	</style>
</head>
<body>
	<h1>자식 자손 선택자 예시</h1>
	<!-- 
	.container의 자손 요소는?(밑에 있는 모든 것) : .box와 .link
	.container의 자식 요소는?(바로 밑에 있는 것만) : .box
	 -->
	<div class="container">
		container
	 <div class="box">
		box
	  <a href="#" class="link">링크</a>
	 </div>
  </div>
		<div class="box">\
		 box2
		 <a href="#" class="link">링크</a>
		 </div>
		 <div class="">


		 </div>
</body>
</html>
