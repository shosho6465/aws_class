<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<!-- 
	calc()함수
	-서로 다른 단위를 계산할 때 사용(예를 들어 50%-5)
	-연산자 앞 뒤로 공백을 반드시 써야 함
	-+, -, *, /

	 -->
<style>
	.container{width: 500px; height: 500px; padding: 10px; box-sizing: border-box; background-color: grey;}
	.inner-container{width: 100%; height: 100%; background-color: white;}
	.inner-container::after{content: ''; clear: both; display: block;}
	.box{width: 235px; height: 100%;}
	.box1{width: calc(50%-5px); height: 100%;}
	.left{float: left; background: red;}
	.right{float: right; background: red;}
	
</style>
</head>
<body>
	<h1>영역 분할 예제</h1>
	<div class="container">
		<div class="inner-container">
     <div class="box left"></div>
	   <div class="box right"></div>
	  </div>	
	</div>
  <h1>영역 분할 예제(calc함수이용)</h1>
	<div class="container">
		<div class="inner-container">
     <div class="box1 left"></div>
	   <div class="box1 right"></div>
	  </div>	
	</div>
</body>
</html>
