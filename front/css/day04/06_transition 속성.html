<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>transition 속성 예제</title>
	<!-- transition (교재 p.177~180)
	 -요소의 스타일이 변경되는 걸 감지해서 서서히 변하도록 해줌
	-애니메이션 효과를 줌
	-단축 속성
	-변화를 감지할 속성

	transition-duration-->

	
	<style>
		.box{
			width: 100px; height: 100px; border: 3px solid black;
			background-color: yellow; font-weight: bold; font-size: 20px; 
			text-align: center; line-height: 100px;
			transition-property: font-size, background;
			transition-duration: 500ms, 2000ms;
			transition-delay: 1s, 1s;
		}
		.box:hover{font-size: 60px; background-color: gray;}

		.box1{width: 100px; height: 100px; background-color: yellow;
		     margin-bottom: 20px; position: relative;
	       transition: left 5s;
				left: 0;}

		.c2:hover .box1{left: calc(100vw - 100px);}
		

		
	</style>
</head>
<body>
	<h1>transition 속성 예제</h1>
	<div class="container">
		<div class="box">꽝</div>
	</div>
<h1>transition 속성 예제</h1>
<div class="container c2">
	<div class="box1 linear"></div>
	<div class="box1 ease"></div>
	<div class="box1 ease-in"></div>
	<div class="box1 ease-out"></div>
</div>
</body>
</html>
