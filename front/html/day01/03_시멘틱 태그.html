<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!-- 
	교재 p39
	시멘틱 태그
	 -기능 없음
	 -의미를 부여할 때 사용
	 -종류
	  -header 태그 : 상단 콘텐츠, 웹 문서의 머리말
		-nav태그 : 메뉴를 그룹화
		-figure 태그 : 멀티미디어 콘텐츠를 그룹화
		-main : 중요한 영역, 문서의 핵심 영역
		-aside 태그 : 부가 콘텐츠 영역
		-section 태그 : 콘텐츠를 그룹화
		-article 태그 : 개별 콘텐츠
    -footer 태그 : 하단 콘텐츠
		-->
		<!-- <div>태그(박스 박스 박스)와 별 다를 건 없지만 보다 의미 전달이 잘 된다. -->
		<header>
			<nav>메뉴들을 배치</nav>
		</header>
		<main>
			<section>
				<article>컨텐츠1</article>
				<article>컨텐츠2</article>
				<article>컨텐츠3</article>
			</section>
			<footer>푸터</footer>
		</main>
</body>
</html>
