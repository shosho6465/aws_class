<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>폰트 속성 예제</title>
	<!-- 
	colot (교재 p.105)
	-글자 색상
	
	색상 지정 방식
	1. 미리 지정된 색상 이름
	 -red, blue, green 등과 같이 100개가 넘는 이름
	 2. 16진수로 표현
	  -#rrggbb 형태로 표시
		-rr은 빨강, gg는 녹색, bb 파랑 색상 정보를 16진수로 표현(0~9, a~f)
		-각 rr값이 같고, gg값이 같고, bb값이 같으면 #rgb로 줄여 쓸 수 있음
		-red => #ff0000 => #f00
		-white => #ffffff =>#fff
	  -black => #000000 => #000
		3. rgb함수/rgba함수
		 -rgb(숫자,숫자,숫자), rgba(숫자,숫자,숫자,투명도)
		  -숫자는 0~255
			-투명도는 0~!사이의 실수, 1이면 불투명, 0이면 투명
		-#f00 => rgb(255,0,0) => rgba(255,0,0,1)
	4. hsl(숫자,숫자,숫자), hsla(숫자,숫자,숫자,투명도)
	 -색상,채도,명도를 이용하여 색상을 표시

	 font-weight (교재 p.99)
	 -폰트 굵기
	 -100~900사이의 값을 100단위로 입력
	 -nomal : 400
	 -bold : 700
	
	font-size (교재 p.91)
	-폰트 크기
	-숫자와 단위를 함께 사용

	font-family
	-폰트 종류를 지정
	-일반적으로 여러 폰트를 한 번에 지정
	 -왼쪽 폰트가 있으면 적용, 없으면 오른쪽 폰트로 이동
	 -보통 제일 오른쪽은 기본 폰트 중 하나를 선택(예. mono-space, serif)
	 -폰트 이름이 한글인 경우 영문명도 함께 작성
	 -폰트 이름이 여러 단어인 경우 ''나 ""를 반드시 붙여야 함
	-->

<style>
.box1{ font-family: 'Courier New', Courier, monospace;}
.box2{ font-family: '';}
.box3{ font-family: ';}

.box4{ color: red}
.box4{ color: red}
.box4{ color: red font-size: 30px}
</style>

</head>
<body>

	<div class="box1">안녕하세요. 제 이름은 홍길동입니다.</div>
