<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.menu-list{
			list-style: none;
			padding: 0;


		}
		.menu-item{
			border: 3px solid black;
			float: left;
			height: 50px;
			width: 33.333%;
			box-sizing: border-box;
			
		}
		.menu-link{
			color: black;
			text-decoration: none;
			display:block;
			height: 100%;
			text-align: center;
			line-height: 44px;
	  }
		.menu-item + .menu-item{
			border-left:none
		}
		.menu-link:hover{background-color: yellow;}
	</style>
</head>
<body>
	<h1>메뉴 연습 예제</h1>
	<ul class="menu-list">
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴1</a>
		</li>
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴2</a>
		</li>
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴3</a>
		</li>
	</ul>
	<div>1</div>
</body>
</html>
