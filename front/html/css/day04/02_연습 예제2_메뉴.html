<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>메뉴 연습 예제</title>
	<style>
		.menu-list{
			width: calc(100% / 3);
			height: 300px;
			float: left;
			border: 3px solid pink;
			list-style-type: none;
			padding: 0;
			display: block;
		}
		.menu-item{
			 height: 300px;
			float: left;
			border: 3px solid black
		}
	  a{
		  color: black;
			text-decoration: none;
	   }
	</style>
</head>
<body>
	<h1>메뉴 연습 예제</h1>
	<ul class="menu-list">
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴1</a>
		</li>
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴2</a>
		</li>
		<li class="menu-item">
			<a href="#" class="menu-link">메뉴3</a>
		</li>
	</ul>
</body>
</html>
