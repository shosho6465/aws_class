	<!-- 
	ifrmae태그
	-다른 문서를 가져와서 배치하는 태그
	-속성
	 -src : 가져올 문서를 지정
	 -width/height : 프레임의 너비/높이를 지정
	 -name : 프레임 이름을 지정
	 -frameborder: 테두리 두께를 지정. 잘 사용 안 함. 스타일로 처리
	-->
	 <iframe src="02_form태그 연습 예제.html" frameborder="1" width="300"></iframe>
	 <iframe width="560" height="315" frameborder="0"></iframe>
</body>
