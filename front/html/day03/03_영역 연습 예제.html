<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.container{
			border: 3px solid black;
			float: left;
		}
		.box{
			width: 100px;
			height: 150px;
			float: left;
			margin: 10px;
		}
		.box+.box{
			margin-left: 0;
		}
		.box1{
			background-color: pink;
		}
		.box2{
			background-color: pink;
		}
		.box3{
			background-color: pink;
		}

	</style>
</head>
<body>
	<!-- 
		자식 요소인 box의 크기가 정해질 때 3분할 예제
		각 box의 너비/높이는 100px/150px
		각 box 사이의 간격은 10px
		box들과 container1사이의 간격은 10px
		container1의 테두리는 3px 실선 검은색
		각 box는 배경이 노란색
	-->
		<div class="container">
		<div class="box box1"></div>
		<div class="box box2"></div>
		<div class="box box2"></div>
		</div>
</body>
</html>
