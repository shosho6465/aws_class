<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>영역 연습 예제</title>

	<style>
   .container1{border: 3px solid black; float:left; padding: 10px;}
	 .box{width:100px ; height: 150px; background-color: yellow; float: left;}
	 .container1>div:nth-of-type(1){background-color: aqua;}
	 .container1>div:nth-of-type(2){background-color: pink; margin-left: 10px;}
	 .container1>div:nth-of-type(3){background-color: rgb(125, 232, 125); margin-left: 10px}

	</style>

  <style>
		.clearfix{
			content: ''; display: block; clear:both
		}

		.container1-1{
			border: 3px solid black;
			padding: 10px;
			float: left;
		}
		.container1-1 .box1{
			width: 100px; height: 100px;
			background-color: yellow;
			float: left;
			margin-left: 10px;
		}
		.container1-1 > .inner-container{
			margin-left: -10px;
		}
	</style>

  <style>
   .container2{
		width: 500px; height: 200px;
		border: 3px solid black; padding: 10px;}
	 .box2{
		width: calc((100%-20px)/3); height: 100%;
		float:left; background-color: green;}
	 .container2 > .box2 + .box2{
		margin-left: 10px;}

	</style>
</head>
<body class="clearfix">
	<!-- 
	자식 요소인 box의 크기가 정해질 때 3분할 예제
	각 box의 너비/높이는 100px/150px
	각 box 사이의 간격은 10px
	box들과 container1 사이의 간격은 10px
	container1의 테두리는 3px 실선 검은색
	각 box는 배경이 노란색 -->
	<h1>영역 분할 예제</h1>
	<div class="container1">
		<div class="box"></div>
		<div class="box"></div>
		<div class="box"></div>
	</div>
  <!--
	위 예제 방식과 다른점
	-위에 있는 방식은 2,3 box에 왼쪽 여백을 지정하는데,
	 여기서 사용하는 방식은 모두 왼쪽 여백을 지정
	 -->
	<div class="container1-1">
		<div class="inner-container"></div>
		 <div class="box1"></div>
		 <div class="box1"></div>
		 <div class="box1"></div>
		</div>
	</div>
  <!--
	container2의 컨텐츠 너비/높이가 500px/200px
	container2의 테두리 3px 실선 검은색
	container2와 box의 간격 10px
	box 사이의 간격 10px
	box 색상 green 
	calc 함수 이용
	 -->
	<div class="container2">
		<div class="box2"></div>
		<div class="box2"></div>
		<div class="box2"></div>
	</div>
</body>
</html>
