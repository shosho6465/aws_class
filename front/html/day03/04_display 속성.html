<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>display 속성 예제</title>
	<style>
		[class^=box]{
			width: 200px; height: 200px;
			border: 1px solid black;
			background: yellow;
		}
		.box1{ display: block;}
		.box2{display: inline;}
		.box3{display: inline;}
		.container2{
			border: 3px solid black;
			margin-top: 10px
		}
		.container2 > .box{
			border: none; width: 33.333%;
			display: inline-block;
		}
	</style>
</head>
<body>
<!-- 
	display
	-요소의 display를 변경하는 속성
	-값
	 -inline: 
	 -inline-block:
	 -block
	 -none: 안 보이게 감춤
	-각 태그마다 기본 display 값이 있는데 이를 변경하는 속성
-->
<h1>dispaly 속성 예제</h1>
<div class="container">
<div class="box1">div태그입니다.(block) w:200px, h:200</div>
<div class="box2">div태그입니다(inline-block) w:200px, h:200</div>
<div class="box3">div태그입니다.(inline) w:200px, h:200</div>
</div>
<div class="container2">
	<div class="box">1</div><div class="box">1</div><div class="box">3</div>

</body>
</html>
