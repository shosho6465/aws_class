<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.container{
			border: 3px solid black;
			padding-left: 10px;
			padding-top: 10px;
			padding-bottom: 10px;
			
		}
		.container::after{
			content: ''; display: block; clear: both;
		}
		.box{
			width: 150px;
			height: 200px;
			float: left;
		}
		.box1{
			background-color: red;
			margin-right: 10px;
			float:left
			
		}
		.box2{
			background-color: blue;
			float: left
		}

	</style>
</head>
<body>
	<!-- 
		각 box 요소의 너비/높이는 150px/200px
		각 box는 한 라인에 배치
		box와 box 사이의 간격은 10px
		왼쪽 box 배경은 red, 오른쪽 box 배경은 blue
		container는 테두리 3px 실선 검은색
		container와 첫번째 박스 사이의 여백은 10px
		container와 각 box사이의 위아래 여백은 10px
	-->
		<div class="container">
			<div class="box box1"></div>
			<div class="box box2"></div>
		</div>
</body>
</html>
