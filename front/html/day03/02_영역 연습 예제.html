<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>영역 연습 예제</title>

 <style>
	 .container{border: 3px solid black; padding: 10px; float: left;}
	 .box{
			width: 150px; height: 200px; background-color: red; box-sizing: border-box; float: left;
		}
		.container>div:nth-of-type(2){background-color: blue; margin-left: 10px;}
		.container::after{content: ''; display: block; clear: both;}
		body::after{content: ''; display: block; clear: both;}
 </style>
</head>
<body>
	<h1>영역 연습 예제</h1>
	<!-- 
	각 box 요소의 너비/높이는 150px/200px
	각box는 한 라인에 배치
	box와 box 사이의 간격은 10px
	왼쪽 box 배경은 red, 오른쪽 box 배경은 blue
	container는 테두리 3px 실선 검은색
	container와 첫번째 박스 사이의 여백은 10px
	container와 각 box 사이의 위아래 여백은 10px
	-->
	<div class="container">
		<div class="box"></div>
		<div class="box"></div>
	</div>
</body>
</html>
