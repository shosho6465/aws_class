<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>조건문 예제</title>
</head>
<body>
	<h1>조건문 예제</h1>
	<script>
		/*
		조건문은은 언제 쓰는지?
		- A이면 B해라 하고 표현할 수 있을 때 조건문을 사용
		if문 문법
		if(조건문){
		실행문;
		}
		-조건문 : A, 실행문 : B
		-예시
		 -성적이 90점 이상이고 100점 이하라면 A를 알림창으로 띄워라
		 if(성적이 90점 이상이고 100점 이하라면){
		    A를 알림창으로 띄워라;
				}
				if(성적이 90 보다 크거나 같고 성적 100 보다 작거나 같다){
				alert("A")};
				if(성적 >= 90 && 성적 <= 100){
				alert("A")}

				-if else문
				if(조건식){
				   실행문1;}
				else{
				실행문2}
			
				-예시
				 -성적이 90점이상이고 100점 이하이면 A라고 출력하고 아니면 A가 아닙니다라고 출력해라

				 if(성적 >= 90 && 성적 <= 100){
				 document('A')}
				 else{'A가 아닙니다'}

				-if else if문
				 -else if문 여러개 올 수도 있음
				 -else는 없을 수도 있음
				 -문법
				 if(조건식1){
				 실행문1;}
				 else if(조건식2){
				 실행문2;}
				 else{
				 실행문3;}
				-예시
			  
		*/
		let num1 = 0;
		if(num1 > 0){
			document.write('${num1}은 양수이다. <br>')}
		
			if(num1 > 0){document.write('${num1}은 양수이다. <br>')}
			else{document.write('${num1}은 양수가 아닙니다. <br>')}

			/*
			num1이 양수이면 양수라고 출력하고
			num1이 음수이면 음수라고 출력하고
			아니면 0이라고 출력하는 코드*/
			
	</script>
</body>
</html>
