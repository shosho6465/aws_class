<body>
	<div class="container">
		<div class="inner-container">
			<div class="left-box">
        <div class="box box1"></div>
				<div class="box box1"></div>
				<div class="box box1"></div>
			</div>
			<div class="right-box">
				<div class="box box3"></div>
				<div class="box box4"></div>
				<div class="box box5"></div>
			</div>
		</div>

	<script>
		/*
		1. 부모 요소 탐색
		요소.parentElement
		-요소의 부모 요소를 탐색

		2. 조상 탐색(부모 포함)
		요소.closet("선택자")
		-요소의 조상들 중, 선택자와 일치하는 가장 가까운 조상 요소를 선택
		-없으면 null을 반환

		3. 자손 탐색
		 1. 자식 탐색
		 요소.firstElementChild
		 -첫 번째 자식 요소를 선택
		 요소.lastElementChild
		 -마지막 자식 요소를 선택
		 요소.cildren
		 -모든 자식 요소를 선택
		 -foreach를 사용하지 못함. 사용하려면 array로 변환 후 사용
		 2. 자손 탐색
		 요소.querySelector(선택자)
		 -요소의 자손들 중 선택자와 일치하는 첫 번째 요소를 선택
		 요소.querySelectorAll(선택자)
		 -요소의 자손들 중 선택자와 일치하는 모든 자손 요소를 선택

		 형제 탐색
		 요소.nextElementSibling
		 -요소의 다음 요소를 선택
		요소.previousElementSibling
		-요소의 이전 요소를 선택

		모든 형제 선택자
		const 형제요소 = [...요소.parentElement.children].filter((child)=> child !== 요소) 
		-요소.parentElement.children : 나를 포함한 형제들
		child !== 요소 : 나를 제외한 요소들 선택

		형제들 중 원하는 선택자에 맞는 형제를 탐색
		요소.parentElement.querySelector(선택자)
		*/
		const leftbox = document.querySelector(".left-box");
		leftbox.closet(".container").style.borderColor = "red";
		leftBox.parentElement.style.borderStyle = "dotted";
		const leftCenterBox = document.querySelector(".left-box > .box2");
		leftCenterBox.style.backgroundColor = "yellow";
    
		leftCenterBox.previousElementSibling.style.backgroundColor = "blue";

		const rightBox = document.querySelector("right-box");
		fightBox.firstElementChild.style.backgroundColor = "tomato";

		const children = rightBox.children;
		for(i=0; childrem.length; ii++){
			 children[i].style.borderWidth = "10px";
		}

	</script>
</body>

</html>
