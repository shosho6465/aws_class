<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>자료형</title>
</head>
<body>
	<h1>자료형 예제</h1>

	<script>
/*
1. 숫자: number
-정수, 실수
-  Infinity(무한), -infinity(-무한)  ,NaN(Not a Number: 숫자가 아님) 
2. 문자열: string
-""나 '', `` 안에 있는 모든 문자들
-`` 안에 &{변수값}을 이용하여 변수값이 들어간 문자열을 쉽게 생성
3. boolean
- 참 또는 거짓, true 또는 false
4.null
-값이 비어있음을 나타냄
5. ubdefined
-초기화 하지 않은 변수에 들어가는 값. 값이 정해지지 않음을 나타냄
6. bigit
-큰 정수를 나타냄
-정수 뒤에 접미사 n을 붙임
7. 심볼: symbol
-고유하고 변경 불가능한 자료형
-주로 객체 속성키로 사용
8. object
-배열, 객체, null
9. function
-함수
*/

let num1 = 1;
let num2 = 1;
let num3 = Infinity;
let num4 = NaN;

let str1 = `안녕`;
let str2 = `안녕`;
let str3 = `안녕`;
let str4 = '${str3}하세요';
document.write(str4);

//boolean
let isEven = true
let isOk = false

//null
let sample = null

//undefined
let sample2;
document.write(`${sample2}');

//bigit
let bigNum = 12345678901234567890123445670n;
document.write('${bigNum}<br>');


*/
typeof 값
-값의 타입을 알려주는 연산자
*/
document.write(`123의 타입: ${typeof 123}<br>`);
document.write(`123n의 타입: ${typeof 123}<br>`);

document.write(`123`의 타입: ${typeof "123"}<br>`);

document.write(`null의 타입: ${typeof null}<br>`);

document.write(`123의 타입: ${typeof 123}<br>`);

document.write(`123의 타입: ${typeof 123}<br>`);



	</script>
</body>
</html>
